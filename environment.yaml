name: mitotic
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - monai
    - pynrrd
    - scikit-learn
    - scikit-image
    - opencv-python
    - pillow
    - torch==2.4.0+cu121
    - torchvision==0.19.0+cu121
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - git+https://github.com/facebookresearch/segment-anything.git
    - git+https://github.com/ChaoningZhang/MobileSAM.git 
    - triton
    - cupy-cuda12x
    - cucim
    - timm
  - lightning
  - pandas
  - numpy
  - matplotlib
