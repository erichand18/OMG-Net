[BASEMODEL]
Training_Stratgy		= "SelectedCells"
Mask_Input				= true
Input_Type              = "3_Channel"
Activation              = "Identity"
Backbone                = "resnet50"
Model                   = "convnet"
Loss_Function           = "CrossEntropyLoss"
Batch_Size              = 128
Precision               = "16-mixed"
Vis                     = [0]
Num_of_Worker           = 16
GPU_ID                  = [0]
Max_Epochs              = 50
Random_Seed             = 9374

[AUGMENTATION]
horizontalflip          = 0.5
randombrightnesscontrast= 0.2
Colour_Sigma            = 0.014
Colour_Mode             = 'uniform'

[CHECKPOINT]
logger_folder           = '/lightning_logs/'
model_name              = "Classifier"
Mode					= "min"
Monitor                 = "val_loss"
filename                = '{epoch:02d}-{val_loss:.4f}_{val_f1_score:.4f}_SAM_Classifier'
save_top_k              = 10
save_last			    = false

[DATA]
Patch_Size              = [256,256]
Input_Size              = [128,128]
Downscale_Factor		= 1
Num_of_Classes          = 2
Dataframe               = '/final_dataset/final_dataset_filtered.csv'
datasets 				= ['MIDOG']
species					= ['Human', 'Canine']
nrrd_path               = "/nrrd"
val_size                = 0.1
filenames_test          = ["006","007","014","015","018","026",
			   "029","031","032","035","050","052",
			   "057","058","059","064","066","074",
			   "088","093","095","100","102","104",
			   "107","109","115","116","123","124",
			   "128","147","150","203","212","218",
			   "220","230","232","234","236","239",
			   "241","249","251","252","253","256",
			   "257","268","269","276","291","292",
			   "295","305","310","311","315","329",
			   "336","338","339","344","345","346",
			   "353","354","366","368","370","373",
			   "375","383","386","389","390","398",
			   "413","414","419","422","425","426",
			   "427","439","442","456","458","463",
			   "472","476","477","481","484","485",
			   "487","491","497","504","510","512",
			   "528","531","533","534","537","538",
			   "539","541","552",]

[OPTIMIZER]
Algorithm               = 'AdamW'
eps                     = 1e-7
lr                      = 3e-4

[REGULARIZATION]
Label_Smoothing 		= 0.01
Stoch_Depth 			= 0.05
Weight_Decay 			= 2e-3
Momentum 				= 0.9
Dropout_Prob            = 0.2

[SCHEDULER]
Type = "CosineAnnealingLR"
T_max = 50
eta_min = 1e-5